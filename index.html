<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070b1c" />
    <title>Pulse</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pulse" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            },
            colors: {
              // Vision UI palette
              brand: {
                DEFAULT: '#0075FF',
                blue: '#2152FF',
                purple: '#582CFF',
                cyan: '#21D4FD',
                indigo: '#4318FF',
              },
            },
            boxShadow: {
              glow: '0 8px 26px rgba(33, 82, 255, 0.35)',
              card: '0 12px 40px rgba(2, 5, 21, 0.45)',
            },
          },
        },
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ---------- Vision UI base ---------- */
      body {
        position: relative;
        min-height: 100vh;
        background:
          linear-gradient(159.02deg, #0f123b 14.25%, #090d2e 56.45%, #020515 100%);
        background-attachment: fixed;
      }
      #root {
        position: relative;
        z-index: 1;
      }

      /* ---------- Liquid-glass background (drifting glow blobs) ---------- */
      .liquid-bg {
        position: fixed;
        inset: 0;
        overflow: hidden;
        z-index: 0;
        pointer-events: none;
      }
      .liquid-bg .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
        mix-blend-mode: screen;
        will-change: transform;
      }
      .blob-1 {
        width: 46vw; height: 46vw; min-width: 320px; min-height: 320px;
        left: -8vw; top: -10vw; opacity: 0.55;
        background: radial-gradient(circle at 30% 30%, #2152ff, transparent 70%);
        animation: float1 22s ease-in-out infinite;
      }
      .blob-2 {
        width: 42vw; height: 42vw; min-width: 300px; min-height: 300px;
        right: -10vw; top: -6vw; opacity: 0.5;
        background: radial-gradient(circle at 70% 30%, #7551ff, transparent 70%);
        animation: float2 26s ease-in-out infinite;
      }
      .blob-3 {
        width: 52vw; height: 52vw; min-width: 340px; min-height: 340px;
        left: 28vw; bottom: -24vw; opacity: 0.35;
        background: radial-gradient(circle at 50% 50%, #21d4fd, transparent 70%);
        animation: float3 30s ease-in-out infinite;
      }
      @keyframes float1 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(6vw, 4vw) scale(1.12); }
      }
      @keyframes float2 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(-5vw, 6vw) scale(1.08); }
      }
      @keyframes float3 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(-4vw, -6vw) scale(1.15); }
      }
      @media (prefers-reduced-motion: reduce) {
        .liquid-bg .blob { animation: none !important; }
      }

      /* ---------- Glass surfaces ---------- */
      .glass {
        position: relative;
        background: linear-gradient(127.09deg, rgba(13, 18, 48, 0.74) 19.41%, rgba(10, 14, 35, 0.58) 76.65%);
        backdrop-filter: blur(20px) saturate(135%);
        -webkit-backdrop-filter: blur(20px) saturate(135%);
        border: 1px solid rgba(255, 255, 255, 0.10);
        box-shadow: 0 12px 40px rgba(2, 5, 21, 0.45);
      }
      /* Soft specular sheen across the top edge */
      .glass::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.07), transparent 32%);
      }
      .glass-hover {
        transition: transform 0.35s cubic-bezier(0.2, 0.7, 0.3, 1),
          box-shadow 0.35s ease, border-color 0.35s ease;
      }
      .glass-hover:hover {
        transform: translateY(-3px);
        border-color: rgba(33, 150, 255, 0.45);
        box-shadow: 0 18px 50px rgba(2, 5, 21, 0.55), 0 0 0 1px rgba(33, 150, 255, 0.15);
      }

      /* ---------- Brand gradient button ---------- */
      .btn-brand {
        background-image: linear-gradient(135deg, #0075ff 0%, #582cff 100%);
        box-shadow: 0 8px 24px rgba(33, 82, 255, 0.35);
        transition: filter 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      }
      .btn-brand:hover:not(:disabled) {
        filter: brightness(1.08);
        box-shadow: 0 10px 28px rgba(33, 82, 255, 0.5);
      }
      .btn-brand:active:not(:disabled) { transform: translateY(1px); }

      /* Frosted glass for ghost buttons / inputs */
      .glass-soft {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.10);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        transition: background 0.2s ease, border-color 0.2s ease;
      }
      .glass-soft:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.18);
      }
      .glass-input {
        background: rgba(8, 11, 28, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.10);
        transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      }
      .glass-input:focus {
        border-color: rgba(33, 150, 255, 0.7);
        box-shadow: 0 0 0 3px rgba(33, 150, 255, 0.16);
        background: rgba(8, 11, 28, 0.75);
      }

      /* ---------- Gradient progress fills ---------- */
      .grad-blue   { background-image: linear-gradient(90deg, #2152ff, #21d4fd); }
      .grad-green  { background-image: linear-gradient(90deg, #01b574, #2bd4a0); }
      .grad-amber  { background-image: linear-gradient(90deg, #f0a500, #ffcf5c); }
      .grad-sky    { background-image: linear-gradient(90deg, #0075ff, #21d4fd); }
      .grad-violet { background-image: linear-gradient(90deg, #582cff, #be6dff); }
      .grad-red    { background-image: linear-gradient(90deg, #e31a1a, #ff6a6a); }

      /* Brand gradient text (headings) */
      .text-gradient-brand {
        background-image: linear-gradient(90deg, #ffffff 0%, #a3b6ff 120%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      /* ---------- Form controls ---------- */
      input[type='range'] { accent-color: #0075ff; }
      input[type='checkbox'] { accent-color: #0075ff; }
      /* Native date/time picker indicators on dark glass */
      input[type='date']::-webkit-calendar-picker-indicator,
      input[type='time']::-webkit-calendar-picker-indicator {
        filter: invert(0.8);
        opacity: 0.7;
        cursor: pointer;
      }
      select option { background: #0b1024; color: #e2e8f0; }

      /* ---------- Custom scrollbar ---------- */
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.12);
        border-radius: 9999px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.22); background-clip: padding-box; }
      ::selection { background: rgba(33, 82, 255, 0.4); }
    </style>
  </head>
  <body class="text-slate-100 antialiased">
    <div class="liquid-bg" aria-hidden="true">
      <span class="blob blob-1"></span>
      <span class="blob blob-2"></span>
      <span class="blob blob-3"></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
